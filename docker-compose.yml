services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64

    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris

    volumes:
      - iris_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 3s
      retries: 30

  runner:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    profiles: ["tools"]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/iris.sh"]
    command: ["help"]

    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: iris
      PGUSER: iris
      PGPASSWORD: iris
      PGCONNECT_TIMEOUT: "5"

    volumes:
      - .:/workspace:ro

    depends_on:
      db:
        condition: service_healthy

volumes:
  iris_pgdata:
